name: PR validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ombi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2
        with:
          path: ./ombi
      - name: Build and smoke-test the app
        run: |
          set -euo pipefail
          cp .templates/*.sh ombi/
          base_image=$(jq -er '.build_from.amd64' ombi/build.json)
          base_digest=$(<ombi/base-image.digest)
          docker build --build-arg "BUILD_FROM=$base_image@$base_digest" \
            --build-arg "BUILD_VERSION=$(yq -r .version ombi/config.yaml)" \
            --tag ombi:pr-smoke ombi
          bash scripts/smoke_ombi_startup.sh ombi:pr-smoke
      - name: Fuzz upstream release tags
        run: |
          python3.12 -m venv "$RUNNER_TEMP/ombi-fuzz"
          "$RUNNER_TEMP/ombi-fuzz/bin/python" -m pip install --require-hashes \
            --only-binary=:all: -r .github/requirements.txt -r .github/fuzz-requirements.txt
          "$RUNNER_TEMP/ombi-fuzz/bin/python" scripts/fuzz_release_tags.py -runs=20000 -max_len=256
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
