# yamllint disable rule:line-length
---
name: Update Ombi

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions: {}

jobs:
  update:
    if: ${{ github.repository_owner == 'Wheemer' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: >-
          python3 -m pip install --require-hashes --only-binary=:all:
          -r .github/requirements.txt

      - name: Check Ombi release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_ombi.py

      - name: Commit update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pending=$(gh pr list --base master --author app/dependabot --json number --jq '.[].number')
          if [[ -n "$pending" ]]; then
            echo "Waiting for Dependabot updates to merge."
            exit 0
          fi

          if git diff --quiet -- ombi/base-image.digest ombi/build.json ombi/config.yaml ombi/updater.json ombi/CHANGELOG.md; then
            echo "No Ombi update found."
            exit 0
          fi

          version=$(python3 - <<'PY'
          import yaml
          from pathlib import Path
          print(yaml.safe_load(Path("ombi/config.yaml").read_text())["version"])
          PY
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ombi/base-image.digest ombi/build.json ombi/config.yaml ombi/updater.json ombi/CHANGELOG.md
          git commit -m "Update Ombi to ${version}"
          candidate="ombi-candidate/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$candidate"
          gh workflow run onpush_builder.yaml --ref "$candidate" -f addon=ombi
